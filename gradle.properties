# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric toolchain
# NOTE: 1.21.11 is the LAST version Fabric officially updates Yarn/Intermediary for.
# Double check https://fabricmc.net/develop/ for the newest build numbers before
# you start, since Yarn build numbers (build.4 etc.) get bumped over time.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.2

loom_version=1.14-SNAPSHOT

# Mod properties
mod_version=1.0.3
maven_group=com.example.tudursvehiclemod
archives_base_name=tudursvehiclemod

# Dependencies
fabric_version=0.139.4+1.21.11
