plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom already adds the Fabric/Mojang repos it needs automatically.
}

loom {
	// Keeps client-only code (rendering, OBJ loading) out of the dedicated server jar.
	splitEnvironmentSourceSets()

	mods {
		"tudursvehiclemod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API - entity rendering registry, resource reload listeners, etc.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Lets an ADDON mod depend on this one. `./gradlew publishToMavenLocal` installs
// the remapped jar (plus sources) into the local Maven repository, which an addon
// project then resolves with `modImplementation "com.example.tudursvehiclemod:tudursvehiclemod:<version>"`
// after adding `mavenLocal()` to its own repositories - see Readme_Addon_Mod.md.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		// Only the local repository by default - add a real one here to distribute more widely.
		mavenLocal()
	}
}
